name: MCP server bug
description: Problem with @signaledi/mcp-server
title: "[mcp-server] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not paste API keys or production EDI with PII. SignalEDI/mcp-server is the source of truth; include only a minimal, sanitized reproduction.
  - type: input
    id: version
    attributes:
      label: npm version
      placeholder: "0.5.0"
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Cursor
        - Claude Desktop
        - Claude Code
        - Windsurf
        - Other
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
